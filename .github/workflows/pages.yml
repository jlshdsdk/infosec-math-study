name: Publish study website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the verified website
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check corpus and mathematics
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 tools/build_coverage.py --check
          python3 tools/build_inline_slides.py --check
          node tools/build_pages.mjs --check
          npm test
      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
